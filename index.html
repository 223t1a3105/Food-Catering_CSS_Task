<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food & Catering </title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <main class="page">
        <section class="collage" aria-label="Food and catering gallery">

            <!-- Decorative background icons -->
            <div class="decor decor-chef" aria-hidden="true">♟</div>
            <div class="decor decor-pizza" aria-hidden="true">🍕</div>
            <div class="decor decor-burger" aria-hidden="true">🍔</div>
            <div class="decor decor-cutlery" aria-hidden="true">🍴</div>
            <div class="decor decor-slice" aria-hidden="true">◢</div>

            <!-- Five diamond cards -->
            <article class="photo photo-1">
                <img src="food1.jpg" alt="Buffet salad dishes">
            </article>

            <article class="photo photo-2">
                <img src="food2.jpg" alt="Fresh buffet food">
            </article>

            <article class="photo photo-3">
                <img src="food3.jpg" alt="Elegant dinner table">
            </article>

            <article class="photo photo-4">
                <img src="food4.jpg" alt="Dessert buffet">
            </article>

            <article class="photo photo-5">
                <img src="food5.jpg" alt="Outdoor food table">
            </article>

        </section>
    </main>

</body>
</html>
